[project]
name = "cobroverificado"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Brayan Huincho", email = "160342519+BrayanHuincho@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7.0",
    "cryptography>=44",
    "fastapi>=0.162.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=4.5.1.48",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "rapidocr-onnxruntime>=1.4.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# rapidocr exige opencv-python con interfaz gráfica; se cambia por la variante headless
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evaluacion"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "C4", "PT", "RET", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["cobroverificado"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=prepend"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
